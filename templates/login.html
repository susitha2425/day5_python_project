{% extends "base.html" %}

{% block title %}Log in | Student Portal{% endblock %}

{% block content %}
<section class="card auth-card">
    <div class="section-kicker">STUDENT PORTAL</div>
    <h1>Welcome back</h1>
    <p class="intro">Log in with the email and password you used to register.</p>
    <form method="post" action="{{ url_for('login') }}">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" autocomplete="email"
                       placeholder="you@example.com" required>
            </div>
            <div class="col-12">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password"
                       autocomplete="current-password" placeholder="Your password" required>
            </div>
        </div>
        <button class="button btn btn-primary form-submit" type="submit">Log in <span aria-hidden="true">→</span></button>
    </form>
    <p class="form-footer">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
