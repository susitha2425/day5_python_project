{% extends "base.html" %}

{% block title %}Registration complete | Student Portal{% endblock %}

{% block content %}
<section class="card success-card text-center">
    <div class="success-mark" aria-hidden="true">✓</div>
    <div class="section-kicker">YOU'RE ALL SET</div>
    <h1>Registration complete</h1>
    <p class="intro">Welcome, {{ name }}! You have successfully registered.</p>
    <a class="button btn btn-primary" href="{{ url_for('login') }}">Log in to your profile <span aria-hidden="true">→</span></a>
</section>
{% endblock %}
