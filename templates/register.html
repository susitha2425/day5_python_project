{% extends "base.html" %}

{% block title %}Register | Student Portal{% endblock %}

{% block content %}
<section class="card auth-card">
    <div class="section-kicker">STUDENT REGISTRATION</div>
    <h1>Create your account</h1>
    <p class="intro">Register to access your student profile and course dashboard.</p>
    <form id="registration-form" method="post" action="{{ url_for('register') }}">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="name">Full Name</label>
                <input class="form-control" id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Alex Morgan" required>
            </div>
            <div class="col-12">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="age">Age</label>
                <input class="form-control" id="age" name="age" type="text" inputmode="numeric"
                       autocomplete="off" aria-describedby="age-feedback"
                       placeholder="Your age" required>
                <div class="invalid-feedback" id="age-feedback" role="alert"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="gender">Gender</label>
                <select class="form-select" id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    {% for gender in genders %}
                        <option value="{{ gender }}">{{ gender }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="course">Course</label>
                <select class="form-select" id="course" name="course" required>
                    <option value="">Select course</option>
                    {% for course in courses %}
                        <option value="{{ course }}">{{ course }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" minlength="6"
                       autocomplete="new-password" placeholder="At least 6 characters" required>
            </div>
        </div>
        <button class="button btn btn-primary form-submit" type="submit">Create account <span aria-hidden="true">→</span></button>
    </form>
    <p class="form-footer">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
